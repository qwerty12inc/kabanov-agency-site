# Временный конфиг для первого запуска, только HTTP.
#
# Нужен из-за курицы и яйца: боевой deploy/nginx.conf не стартует без файлов
# сертификата, а сертификат не получить, пока сервер не отвечает по HTTP на
# проверку Let's Encrypt. Поэтому сначала поднимаемся с этим конфигом, получаем
# сертификат, затем переключаемся на боевой.
#
# Здесь намеренно нет ни редиректа на https, ни правил канонизации: задача одна —
# отдать ACME-проверку и показать, что сайт на месте.

server {
    listen 80;
    listen [::]:80;
    server_name kabanov.agency www.kabanov.agency;

    # Каталог для проверки Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /var/www/kabanov.agency;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
