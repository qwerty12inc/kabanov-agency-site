# Конфиг nginx для автономной копии kabanov.agency на российском VPS.
#
# Ключевое требование — не расходиться с canonical, который остался от Framer:
#   /            и /en/          — СО слэшем на конце
#   /projects, /categories/ui, … — БЕЗ слэша
# Любое расхождение плодит дубли страниц в поиске, поэтому приводим URL
# к каноничному виду редиректом 301, а не отдаём один и тот же документ по двум адресам.

server {
    listen 80;
    listen [::]:80;
    server_name kabanov.agency www.kabanov.agency;

    # ACME-проверка Let's Encrypt должна ходить по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://kabanov.agency$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kabanov.agency;

    ssl_certificate     /etc/letsencrypt/live/kabanov.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kabanov.agency/privkey.pem;

    return 301 https://kabanov.agency$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kabanov.agency;

    root /var/www/kabanov.agency;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/kabanov.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kabanov.agency/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Сжатие ────────────────────────────────────────────────────────────────
    # Файлы .gz/.br готовит `npm run precompress`, nginx только отдаёт готовое.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml font/ttf;
    gzip_static       on;
    # Требует модуль ngx_brotli. Если не собран — закомментируйте две строки ниже,
    # gzip продолжит работать.
    brotli_static     on;
    brotli            off;

    # ── Приведение URL к каноничному виду ─────────────────────────────────────
    # /en → /en/ (корень локали канонизирован СО слэшем)
    location = /en {
        return 301 https://kabanov.agency/en/;
    }
    # Остальные адреса — БЕЗ слэша: /projects/ → /projects
    # Корни локалей исключены отрицательным просмотром вперёд.
    location ~ ^(?!/en/$)(/.+)/$ {
        return 301 https://kabanov.agency$1;
    }
    # index.html в адресе — тоже дубль
    location ~ ^(.*)/index\.html$ {
        return 301 https://kabanov.agency$1;
    }

    # ── Статика ───────────────────────────────────────────────────────────────
    # Имена файлов в /assets содержат хеш сборки, поэтому кэшируем навсегда.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    location = /sitemap.xml   { expires 1h; }
    location = /sitemap_ru.xml { expires 1h; }
    location = /sitemap_en.xml { expires 1h; }
    location = /robots.txt     { expires 1h; }

    # ── Страницы ──────────────────────────────────────────────────────────────
    # try_files с явным /index.html вместо $uri/ — иначе nginx сам сделает
    # 301 на слэш и сломает канонизацию выше.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header X-Frame-Options SAMEORIGIN;
        # Именно `=404`, а не `/404.html`: с файлом в фолбэке try_files отдал бы
        # страницу со статусом 200 — «мягкая 404», которую поисковик проиндексирует
        # как обычную. Статус проставит error_page ниже.
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }

    # Шрифты могут понадобиться со сторонних поддоменов — на всякий случай.
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/kabanov.agency.access.log;
    error_log  /var/log/nginx/kabanov.agency.error.log;
}
