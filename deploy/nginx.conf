# Конфиг nginx для автономной копии kabanov.agency на российском VPS.
#
# Правила раздачи лежат в locations.conf и подключаются include — тот же файл
# гоняет автотест `npm run check:nginx`, так что проверено ровно то, что здесь.
#
# Установка:
#   cp deploy/locations.conf /etc/nginx/kabanov-locations.conf
#   cp deploy/nginx.conf     /etc/nginx/sites-available/kabanov.agency
#   ln -s /etc/nginx/sites-available/kabanov.agency /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ВАЖНО, порядок первого запуска: блок с TLS не поднимется, пока нет сертификата,
# а сертификат не получить, пока не отвечает HTTP. Поэтому сначала оставьте только
# первый server (порт 80), получите сертификат
#   certbot certonly --webroot -w /var/www/certbot -d kabanov.agency -d www.kabanov.agency
# и лишь потом раскомментируйте блоки с 443.

server {
    listen 80;
    listen [::]:80;
    server_name kabanov.agency www.kabanov.agency;

    # ACME-проверка Let's Encrypt должна ходить по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://kabanov.agency$request_uri;
    }
}

server {
    # `listen ... http2` вместо отдельной директивы `http2 on`: последняя появилась
    # только в nginx 1.25.1, а Ubuntu 22.04/24.04 и Debian 12 везут 1.18–1.24,
    # и конфиг на них просто не стартует. На 1.25.1+ эта форма тоже работает.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kabanov.agency;

    ssl_certificate     /etc/letsencrypt/live/kabanov.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kabanov.agency/privkey.pem;

    return 301 https://kabanov.agency$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kabanov.agency;

    root /var/www/kabanov.agency;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/kabanov.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kabanov.agency/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Сжатие ───────────────────────────────────────────────────────────────
    # Файлы .gz готовит `npm run precompress`, nginx только отдаёт готовое.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json image/svg+xml application/xml font/ttf;
    gzip_static     on;
    # Brotli сжимает эти файлы ещё на треть, но требует модуль ngx_brotli,
    # которого в штатных сборках нет — с ним nginx не стартует. Раскомментируйте,
    # только если модуль собран (проверить: nginx -V 2>&1 | grep brotli).
    # brotli_static on;

    include /etc/nginx/kabanov-locations.conf;

    access_log /var/log/nginx/kabanov.agency.access.log;
    error_log  /var/log/nginx/kabanov.agency.error.log;
}
