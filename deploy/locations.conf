# Правила раздачи сайта. Вынесены отдельно, чтобы автотест гонял ровно тот же
# файл, что уезжает на сервер: `npm run check:nginx` поднимает nginx с этим
# include и проверяет каждое правило запросами.
#
# Ключевое требование — не расходиться с canonical, который остался от Framer:
#   /            и /en/          — СО слэшем на конце
#   /projects, /categories/ui, … — БЕЗ слэша
# Расхождение плодит дубли страниц в поиске, поэтому приводим URL к каноничному
# виду редиректом 301, а не отдаём один документ по двум адресам.

# ── Типы файлов ──────────────────────────────────────────────────────────────
# Блок заменяет унаследованную карту типов целиком, и это осознанно: набор
# расширений у статики фиксирован, так раздача не зависит от версии дистрибутива.
#
# Ради .mjs всё и затевалось: штатный mime.types в nginx до 1.25.6 про него не
# знает и отдаёт application/octet-stream, а браузер отказывается исполнять
# ES-модуль с не-JavaScript типом. Сайт при этом отрисуется, но не оживёт:
# ни гидратации, ни клиентской навигации.
types {
    text/html                             html;
    text/css                              css;
    text/javascript                       js mjs;
    application/json                      json;
    application/xml                       xml;
    text/plain                            txt;
    image/svg+xml                         svg;
    image/png                             png;
    image/jpeg                            jpg jpeg;
    image/gif                             gif;
    image/webp                            webp;
    image/avif                            avif;
    image/x-icon                          ico;
    font/woff2                            woff2;
    font/woff                             woff;
    font/ttf                              ttf;
    video/mp4                             mp4;
    video/webm                            webm;
    application/octet-stream              cmsdata;
}

# ── Приведение URL к каноничному виду ────────────────────────────────────────
# Схема в редиректах зашита как https, а не взята из $scheme. За CDN сервер
# обычно стоит по http: TLS терминируется на стороне CDN. С $scheme редирект
# ушёл бы на http://, и посетитель получал бы лишний хоп, а при агрессивной
# настройке CDN — петлю. Сайт работает только по https (порт 80 целиком
# редиректит наверх), поэтому жёсткая схема здесь безопасна.
# /en → /en/ (корень локали канонизирован СО слэшем)
location = /en {
    return 301 https://$host/en/;
}
# Остальные адреса — БЕЗ слэша: /projects/ → /projects
# Корень локали исключён отрицательным просмотром вперёд, корень сайта не
# подходит под шаблон (нужно минимум два символа).
location ~ ^(?!/en/$)(/.+)/$ {
    return 301 https://$host$1;
}
# index.html в адресе — тоже дубль. Корни локалей вынесены в точные совпадения:
# они канонизированы СО слэшем, и общее правило увело бы их на лишний редирект.
location = /index.html {
    return 301 https://$host/;
}
location = /en/index.html {
    return 301 https://$host/en/;
}
location ~ ^(/.+)/index\.html$ {
    return 301 https://$host$1;
}

# ── Статика ──────────────────────────────────────────────────────────────────
# Имена файлов в /assets содержат хеш сборки, поэтому кэшируем навсегда.
location /assets/ {
    access_log off;
    # Только add_header, без `expires`: тот добавляет свой Cache-Control, и в
    # ответе оказывались два склеенных значения.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files  $uri =404;
}

location = /robots.txt     { expires 1h; }
location = /sitemap.xml    { expires 1h; }
location = /sitemap_ru.xml { expires 1h; }
location = /sitemap_en.xml { expires 1h; }

# Шрифты могут понадобиться со стороннего поддомена.
location ~* \.(woff2?|ttf|otf)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Данные CMS отдаём только как есть. Загрузчик сверяет длину ответа с ожидаемой,
# а у сжатого файла Content-Length — размер архива: рантайм падает с
# «Unexpected response length» и выключает интерактивность страницы.
location ~* \.cmsdata$ {
    gzip off;
    gzip_static off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ── Страницы ─────────────────────────────────────────────────────────────────
location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
    # Явный /index.html вместо $uri/ обязателен: со вторым nginx сам сделал бы
    # 301 на слэш и сломал канонизацию выше.
    # Именно `=404`, а не `/404.html`: с файлом в фолбэке try_files отдал бы
    # страницу со статусом 200 — «мягкая 404», которую поисковик проиндексирует
    # как обычную. Статус проставит error_page.
    try_files $uri $uri/index.html =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-store";
}
